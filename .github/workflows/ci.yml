name: CI

# Added in Phase 2 per DEC-010. Phase 8 requires an end-to-end Anvil test "in
# CI" and Phase 11 requires a "link to CI run", but no phase creates it -- so it
# is created here, before anything depends on it.

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  engine:
    name: engine (pytest + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prahari
          POSTGRES_PASSWORD: prahari
          POSTGRES_DB: prahari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prahari -d prahari"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://prahari:prahari@localhost:5432/prahari
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install (Python pinned per DEC-012)
        working-directory: engine
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Migrations up / down / up
        working-directory: engine
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        working-directory: engine
        run: uv run pytest -q

  guardrails:
    name: global rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Playbook global rule: no emoji anywhere.
      #
      # Scoped to code we WROTE. `anchor/lib` is where Foundry vendors its
      # dependencies, and forge-std ships emoji in its own comments and README.
      # A house style rule has no business policing a third-party library, and
      # because it did, this whole job was red on every push -- which silently
      # skipped every guardrail after it, including the keep-alive tests below.
      # A guardrail that cannot go green stops guarding anything.
      - name: No emoji
        run: |
          if git grep -nP "[\x{1F300}-\x{1FAFF}]" -- \
               '*.ts' '*.tsx' '*.py' '*.md' '*.css' '*.sol' \
               ':!anchor/lib' ; then
            echo "::error::Emoji found (playbook global rule / DEC-002)"; exit 1
          fi
          echo "clean"

      # DEC-002: no decorative glyph used as an icon in rendered UI. Arrows in
      # comments and prose are permitted, so only web source is scanned.
      - name: No decorative glyphs in rendered UI
        run: |
          if grep -rnP "[\x{2700}-\x{27BF}\x{2B00}-\x{2BFF}]|[✓✔✗✘⚠↳]" \
               --include='*.tsx' web/components web/app ; then
            echo "::error::Decorative glyph in rendered UI (DEC-002)"; exit 1
          fi
          echo "clean"

      # Passivity rule: PRAHARI never connects to a hidden service.
      #
      # Scoped to SOURCE, not tests. engine/tests/test_infra.py deliberately
      # contains .onion URLs as fixtures asserting that assert_not_onion()
      # refuses them -- flagging those would punish the very tests that prove
      # the rule holds. The runtime guarantee is enforced separately by a
      # network-layer test that spies on socket.getaddrinfo during a full
      # pivot and asserts zero .onion resolutions are attempted.
      - name: No outbound .onion in source
        run: |
          if grep -rnE "https?://[^[:space:]\"')]*\.onion" \
               --include='*.ts' --include='*.tsx' --include='*.py' \
               engine/engine web/app web/components web/lib web/store ; then
            echo "::error::Outbound .onion reference in source (passivity rule)"; exit 1
          fi
          echo "clean"

      # The guard itself must exist and be wired in.
      - name: Passivity guard is present
        run: |
          grep -q "def assert_not_onion" engine/engine/engines/infra.py || {
            echo "::error::assert_not_onion() is missing"; exit 1; }
          grep -q "OnionRequestBlocked" engine/engine/engines/infra.py || {
            echo "::error::OnionRequestBlocked is missing"; exit 1; }
          echo "clean"

      # Secrets must never be committed. .env.local is gitignored; the example
      # file must stay a placeholder.
      - name: No committed secrets
        run: |
          if git grep -nE "gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}" -- \
               ':!*.md' ':!.github/*' ; then
            echo "::error::Possible API key committed"; exit 1
          fi
          if git ls-files --error-unmatch .env.local 2>/dev/null; then
            echo "::error::.env.local is tracked"; exit 1
          fi
          echo "clean"

      # The keep-alive guard decides whether to ping services that a blown
      # free-tier budget would SUSPEND, so its fail-closed properties are
      # tested here rather than trusted. Stdlib-only and run with the system
      # python on purpose: this job installs nothing.
      - name: Keep-alive guard and runner
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # The product has exactly one name.
      - name: Product name is PRAHARI
        run: |
          if git grep -niE "\bANVESHAN\b" -- ':!docs/DECISIONS.md' ; then
            echo "::error::Second product name found (DEC-001)"; exit 1
          fi
          echo "clean"
