# Render blueprint — deploys BOTH PRAHARI v2 services from the v2-rebuild branch.
# v1 on `main` is never touched. Deploy: render.com -> New -> Blueprint -> pick
# this repo. Free plans sleep after ~15 min idle and cold-start in ~30-60s.
services:
  # ── backend: FastAPI engine (Docker, with Tor) ──────────────────────────
  - type: web
    name: prahari-v2-engine
    runtime: docker
    repo: https://github.com/utkarshwrks/Prahari
    branch: v2-rebuild
    plan: free
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Belt and braces with ENVIRONMENT: engine/admin/auth.py arms its refusal
      # on either. Without one of them set, an engine with no service secret
      # falls back to a PUBLIC dev key and will sign admin tokens with it.
      - key: ENGINE_ENV
        value: production
      # The admin signing key (DEC-060). Generated by Render, never committed;
      # the web service reads the SAME value via fromService below, because a
      # mismatch makes every /admin call 401 and a missing value makes the
      # engine refuse to serve /admin at all.
      - key: ENGINE_SERVICE_SECRET
        generateValue: true
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: CHAIN_ID
        value: "80002"
      - key: CORS_ORIGINS
        value: "*"

  # ── frontend: Next.js web (Node) ────────────────────────────────────────
  - type: web
    name: prahari-v2-web
    runtime: node
    repo: https://github.com/utkarshwrks/Prahari
    branch: v2-rebuild
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    # NEXTAUTH_URL is taken from Render's own RENDER_EXTERNAL_URL at start, so no
    # manual URL step is needed.
    startCommand: NEXTAUTH_URL="$RENDER_EXTERNAL_URL" npm run start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # the engine's public URL (deterministic from the service name above)
      - key: ENGINE_URL
        value: https://prahari-v2-engine.onrender.com
      # a strong auth secret, generated by Render (required in production)
      - key: NEXTAUTH_SECRET
        generateValue: true
      # this is a public demo deployment — enable the pre-filled demo analyst
      - key: ENABLE_DEMO_ACCOUNT
        value: "1"

      # ── v2.1 feature flags ────────────────────────────────────────────────
      # NEXT_PUBLIC_* are inlined AT BUILD TIME, so these must be set here and
      # the service rebuilt -- setting them on a running service changes
      # nothing. Left unset, every v2.1 surface on this branch is unreachable
      # in the deployed build: the routed workspace, the graph lab, the Command
      # Panel and SANGAM Pro all render as though they were never written.
      - key: NEXT_PUBLIC_FF_WORKSPACE
        value: "1"
      - key: NEXT_PUBLIC_FF_GRAPH_LAB
        value: "1"
      - key: NEXT_PUBLIC_FF_SANGAM_PRO
        value: "1"
      # The Command Panel needs the two secrets below; it refuses to start in
      # production without them. Set this to "0" to ship without it.
      - key: NEXT_PUBLIC_FF_COMMAND
        value: "1"

      # ── secrets the Command Panel refuses to start without ────────────────
      # web/lib/passwords.ts and web/lib/serviceToken.ts both THROW in
      # production when these are unset -- deliberately, because a known
      # signing key means anyone can mint an admin token (DEC-045, DEC-060).
      - key: PASSWORD_PEPPER
        generateValue: true
      # Must be the SAME value the engine holds, so it is read from it rather
      # than generated twice.
      - key: ENGINE_SERVICE_SECRET
        fromService:
          type: web
          name: prahari-v2-engine
          envVarKey: ENGINE_SERVICE_SECRET
