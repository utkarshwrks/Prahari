# Render blueprint — deploys BOTH PRAHARI v2 services from the v2-rebuild branch.
# v1 on `main` is never touched. Deploy: render.com -> New -> Blueprint -> pick
# this repo. Free plans sleep after ~15 min idle and cold-start in ~30-60s.
services:
  # ── backend: FastAPI engine (Docker, with Tor) ──────────────────────────
  - type: web
    name: prahari-v2-engine
    runtime: docker
    repo: https://github.com/utkarshwrks/Prahari
    branch: v2-rebuild
    plan: free
    dockerfilePath: ./engine/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: CHAIN_ID
        value: "80002"
      - key: CORS_ORIGINS
        value: "*"

  # ── frontend: Next.js web (Node) ────────────────────────────────────────
  - type: web
    name: prahari-v2-web
    runtime: node
    repo: https://github.com/utkarshwrks/Prahari
    branch: v2-rebuild
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    # NEXTAUTH_URL is taken from Render's own RENDER_EXTERNAL_URL at start, so no
    # manual URL step is needed.
    startCommand: NEXTAUTH_URL="$RENDER_EXTERNAL_URL" npm run start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # the engine's public URL (deterministic from the service name above)
      - key: ENGINE_URL
        value: https://prahari-v2-engine.onrender.com
      # a strong auth secret, generated by Render (required in production)
      - key: NEXTAUTH_SECRET
        generateValue: true
      # this is a public demo deployment — enable the pre-filled demo analyst
      - key: ENABLE_DEMO_ACCOUNT
        value: "1"
