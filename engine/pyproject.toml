[project]
name = "prahari-engine"
version = "2.0.0"
description = "PRAHARI v2 attribution engine - ingest, extract, four engines, fusion, audit."
readme = "README.md"

# Pinned per DEC-012. The build machine defaults to Python 3.14, for which
# spaCy, PyTorch CPU and Splink do not reliably publish wheels. Do not widen
# this without checking those three first.
requires-python = ">=3.11,<3.13"

# Every runtime import the engine makes, declared here.
#
# The Phase 11 fresh-clone run caught these missing: dependencies added
# ad-hoc with `uv pip install` during Phases 3-8 worked on the build machine
# and were invisible everywhere else. A fresh clone failed with
# ModuleNotFoundError on 26 tests -- which is what a judge's laptop and the CI
# runner would both have seen.
dependencies = [
    # --- Phase 2: service ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    # --- Phase 3: ingest and extraction ---
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pgpy>=0.6",
    "spacy>=3.7",
    # --- Phase 4: identity graph ---
    "neo4j>=5.24",
    "splink>=4.0",
    # --- Phase 5: stylometry and behaviour ---
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "ruptures>=1.1",
    # --- Phase 6: infrastructure fingerprinting ---
    "mmh3>=5.0",
    # --- Phase 8: audit and anchoring ---
    "pynacl>=1.5",
    "eth-hash[pycryptodome]>=0.7",
    "pycryptodome>=3.20",
    "web3>=7.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
